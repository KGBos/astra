name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q main.py src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  benchmark:
    # T-03 perf gate. Two levels:
    #   * floor (30 FPS) -- hard; below this the job FAILS the build.
    #   * budget (60 FPS, the AGENTS.md #2 guardrail) -- warn-only until
    #     Phase 1 recovers headroom; the shortfall is printed on every run.
    #     Flip to enforced by adding --enforce-budget once Phase 1 lands.
    # A crash or hang in the benchmark fails this job (no continue-on-error).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Benchmark matrix (80x32 / 120x40 / 160x50)
        run: python tools/bench_matrix.py --history docs/perf_history.tsv
      - name: Upload perf history artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-history
          path: docs/perf_history.tsv

  terminal-restore:
    # T-03 / v1.0 exit criterion #6: pty test matrix proving the terminal is
    # restored on every exit path (graceful quit, SIGINT, SIGTERM).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pty terminal-restore matrix
        run: python -m unittest tests.test_pty_terminal_restore -v
